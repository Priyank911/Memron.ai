apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-tunnel-api
  labels:
    app: memron
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memron
      component: api
  template:
    metadata:
      labels:
        app: memron
        component: api
    spec:
      containers:
        - name: api
          image: memron/memory-tunnel-api:latest
          ports:
            - containerPort: 4200
          envFrom:
            - secretRef:
                name: memron-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 4200
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4200
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memory-tunnel-api
spec:
  selector:
    app: memron
    component: api
  ports:
    - port: 4200
      targetPort: 4200
  type: ClusterIP
